version: "3.9"

services:
  payment:
    container_name: payment_service
    build: ./payment_service
    ports:
      - "${SERVICE_PORT}:8080"
    depends_on:
      - db

  db:
    container_name: main_db
    image: cockroachdb/cockroach:latest-v26.2
    restart: unless-stopped
    command: start-single-node --insecure

    ports:
      - "${COCKROACH_DB}:26257"
      - "${COCKROACH_DB_UI}:8080"

    volumes:
      - ./volumes/cockroach-data:/cockroach/cockroach-data

    environment:
      COCKROACH_DATABASE: main_database
      COCKROACH_USER: admin
      COCKROACH_PASSWORD: apple123

  #  cache:
  #    image: redis