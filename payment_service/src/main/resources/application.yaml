server:
  address: 0.0.0.0
  port: 8080

spring:
  flyway:
    enabled: true

  application:
    name: wallet_backend

  datasource:
    url: "jdbc:postgresql://db:26257/main_database?currentSchema=payment_service"
    username: admin
    password: apple123

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true

  sql:
    init:
      mode: always

logging:
  level:
    org.hibernate.orm.connections.pooling: WARN

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha

scalar:
  path: /doc